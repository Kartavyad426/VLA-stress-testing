<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TaskGen chat</title>
<style>
:root{--bg:#faf9f5;--fg:#1d1d1b;--muted:#6b6a63;--line:#e3e1d8;--card:#f1efe7;--user:#ece8dc;--accent:#7a5c2e;--ok:#2c6e3a;--bad:#a3321f;--warn:#8a6d12}
@media (prefers-color-scheme:dark){:root{--bg:#1c1b19;--fg:#ecebe6;--muted:#a3a29b;--line:#34332f;--card:#262522;--user:#302e2a;--accent:#c79a5e;--ok:#7fc98d;--bad:#ee8a76;--warn:#d9c46a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.55 ui-sans-serif,system-ui,sans-serif;height:100vh;display:flex;flex-direction:column}
.wrapall{flex:1;display:flex;min-height:0}
aside{width:270px;border-right:1px solid var(--line);overflow-y:auto;padding:10px 10px;font-size:13px;flex-shrink:0}
aside h3{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:4px 4px 8px}
.turn{border:1px solid transparent;border-radius:10px;padding:7px 9px;margin:4px 0;cursor:pointer}
.turn:hover{background:var(--card)}
.turn.cur{border-color:var(--accent);background:var(--card)}
.turn .t1{display:flex;gap:6px;align-items:baseline}
.turn .n{color:var(--muted);font-size:11px}
.turn .p{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.turn .t2{color:var(--muted);font-size:12px;margin-top:2px}
.badge{font-size:11px;border-radius:6px;padding:0 6px;border:1px solid var(--line)}
.badge.checked{color:var(--ok);border-color:var(--ok)}.badge.failed{color:var(--bad);border-color:var(--bad)}.badge.draft{color:var(--warn);border-color:var(--warn)}
.turn a{color:var(--accent)}
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.tracedir{font-size:11px;color:var(--muted);margin:10px 4px;word-break:break-all}
header{display:flex;gap:10px;align-items:center;padding:10px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
header .title{font-weight:650;margin-right:8px}
header .title span{color:var(--accent)}
select,button{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:8px;padding:4px 10px;cursor:pointer}
button:hover{border-color:var(--accent)}
button:disabled{opacity:.5;cursor:default}
#log{flex:1;overflow-y:auto;padding:18px 0}
.col{max-width:820px;margin:0 auto;padding:0 18px}
.msg{margin:14px 0}
.user{display:flex;justify-content:flex-end}
.user .bubble{background:var(--user);border-radius:16px;padding:10px 14px;max-width:80%;white-space:pre-wrap}
.agent .text{white-space:pre-wrap}
.steps{margin:6px 0 4px 0;font:13px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace}
details.step{margin:2px 0}
details.step>summary{list-style:none;cursor:pointer;display:flex;gap:8px;align-items:baseline}
details.step>summary::-webkit-details-marker{display:none}
.dot{color:var(--accent)}
.dot.ok{color:var(--ok)}.dot.bad{color:var(--bad)}.dot.run{animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.25}}
.sub{color:var(--muted);padding-left:22px}
.sub::before{content:"⎿  "}
.secs{color:var(--muted);margin-left:auto;padding-left:12px}
pre.json{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin:4px 0 6px 22px;overflow-x:auto;font-size:12px;max-height:360px}
.k{color:#8a5a2b}.s{color:#2c6e3a}.n{color:#2a5d8a}.b{color:#8a2b6e}.z{color:var(--muted)}
@media (prefers-color-scheme:dark){.k{color:#d29a62}.s{color:#7fc98d}.n{color:#8ab4e0}.b{color:#d88ac4}}
.imgs{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.imgs figure{margin:0}.imgs img{width:250px;border-radius:8px;border:1px solid var(--line)}
.imgs figcaption{font-size:12px;color:var(--muted)}
video{max-width:480px;border-radius:8px;border:1px solid var(--line);margin-top:6px}
.err{color:var(--bad)}
footer{border-top:1px solid var(--line);padding:12px 0}
.inbox{display:flex;gap:8px;align-items:flex-end;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px 10px}
textarea{flex:1;border:0;background:transparent;color:var(--fg);font:inherit;resize:none;outline:none;max-height:180px}
.hint{font-size:12px;color:var(--muted);margin-top:6px}
.base{font-size:12px;color:var(--muted)}
.run{font-size:12px;margin-top:2px}.run .okk{color:var(--ok)}.run .bad{color:var(--bad)}
</style>
</head>
<body>
<header>
  <div class="title">TaskGen <span>chat</span></div>
  <label>scene <select id="scene"></select></label>
  <label>model <select id="model"></select></label>
  <button id="b-check" title="do-nothing must fail, the expert must succeed">Check</button>
  <button id="b-new" title="new chat: fresh session, empty sidebar (old sessions stay on disk)">New chat</button>
  <button id="b-render">Render</button>
  <button id="b-composite" title="what the policy sees: exterior composite over the real plate + wrist view (scenes with composite assets)">Composite</button>
  <label>policy <select id="policy"></select></label>
  <button id="b-run" title="run the policy on this turn's scene + task (30 s, a separate process; the chat stays usable)">Run policy</button>
  <button id="b-stoprun" title="stop the running policy" disabled>Stop run</button>
  <button id="b-save">Save</button>
  <button id="b-undo">Undo</button>
  <button id="b-reset">Reset</button>
  <button id="b-stop" title="stop the running request (after the current model or tool call)">Stop</button>
  <span class="base" id="base"></span>
</header>
<div class="wrapall">
<aside><h3>This session</h3><div id="turns"><div class="t2" style="padding:4px">No turns yet. Each prompt and check appears here; click one to reopen its scene and task.</div></div><div class="tracedir" id="tracedir"></div></aside>
<div class="main">
<div id="log"><div class="col" id="col"></div></div>
<footer><div class="col">
  <div class="inbox"><textarea id="in" rows="1" placeholder="Describe what to add and/or the task, e.g. add a three-drawer cabinet with the middle drawer open and a red block inside; the robot takes it out and puts it in the bowl"></textarea><button id="send">Send</button></div>
  <div class="hint">Enter to send · Shift+Enter for a new line · click a step to see its full input and result · every turn is saved as a trace (sidebar: "trace") · local only (127.0.0.1)</div>
</div></footer>
</div></div>
<script>
const col = document.getElementById('col'), logEl = document.getElementById('log'), inp = document.getElementById('in');
let ws, current = null, open = {}, busy = false;
const esc = s => String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function hl(obj){ // colour-coded JSON (user 10-29: JSON in docs/UI is colour-coded)
  const s = JSON.stringify(obj, null, 2);
  return esc(s).replace(/("(\\u[a-zA-Z0-9]{4}|\\[^u]|[^\\"])*"(\s*:)?|\b(true|false)\b|\bnull\b|-?\d+(?:\.\d*)?(?:[eE][+\-]?\d+)?)/g, m => {
    let c = 'n';
    if (/^"/.test(m)) c = /:$/.test(m) ? 'k' : 's'; else if (/true|false/.test(m)) c = 'b'; else if (/null/.test(m)) c = 'z';
    return `<span class="${c}">${m}</span>`;
  });
}
function scroll(){ logEl.scrollTop = logEl.scrollHeight; }
function add(html, cls){ const d = document.createElement('div'); d.className = 'msg ' + cls; d.innerHTML = html; col.appendChild(d); scroll(); return d; }
function agentBlock(){ const d = add('<div class="steps"></div><div class="text"></div>', 'agent'); return {el: d, steps: d.querySelector('.steps'), text: d.querySelector('.text')}; }
function step(label, sub, detail, state, secs){
  if (!current) current = agentBlock();
  const d = document.createElement('details'); d.className = 'step';
  d.innerHTML = `<summary><span class="dot ${state||''}">⏺</span><span>${esc(label)}</span>${secs!=null?`<span class="secs">${secs} s</span>`:''}</summary>` +
                (sub ? `<div class="sub">${esc(sub)}</div>` : '') + (detail!==undefined ? `<pre class="json">${hl(detail)}</pre>` : '');
  current.steps.appendChild(d); scroll(); return d;
}
let running = false;
let prunning = false;
function setBusy(b, r){ busy = b; running = b && (r !== false); document.querySelectorAll('header button, #send').forEach(x => x.disabled = b); document.getElementById('b-stop').disabled = !b; policyRunning(prunning); }
function policyRunning(p){ prunning = p; document.getElementById('b-run').disabled = p || busy; document.getElementById('b-stoprun').disabled = !p; }
function replayTurns(turns){ // after a reload: the session's past prompts and replies (full steps are in each turn's trace)
  for (const t of turns){
    add(`<div class="bubble">${esc(t.kind === 'check' ? '/check' : t.text)}</div>`, 'user');
    const a = agentBlock(); a.text.innerHTML = esc(t.reply || '') + ` <a href="/trace/${t.turn}" target="_blank">(steps: trace #${t.turn})</a>`;
  }
  current = null;
}
function brief(tool, a){
  if (tool === 'add_object') return `add_object(${a.name}, ${a.source.replace('primitive:','')}${a.colour?', '+a.colour:''}${a.size_cm?', '+a.size_cm+' cm':''}${a.params?', levels='+a.params.levels+', open='+a.params.open_level:''})`;
  if (tool === 'place') return `place(${a.name}, ${a.relation}${a.target?', '+a.target:''})`;
  if (tool === 'do_nothing') return `do_nothing(${a.seconds} s)`;
  if (tool === 'expert') return `expert(${(a.steps||[]).map(s=>s[0]+' '+s[1]+(s[2]?'→'+s[2]:'')).join(', ')})`;
  return tool;
}
function resultLine(tool, r, ok){
  if (!ok) return '✗ ' + (r.error || r.infeasible || (r.passed===false?'failed':'failed'));
  if (tool === 'add_object') return `added · ${r.size_cm ? r.size_cm.join(' × ') + ' cm' : ''}${r.graspable===false?' · not graspable':''}`;
  if (tool === 'place') return `placed at (${r.at_cm.slice(0,2).join(', ')}) cm${r.resized?' · resized '+r.resized:''}${r.visible?(' · visible ext '+r.visible.ext.px+' px, wrist '+r.visible.wrist_above.px+' px'):''}`;
  if (tool === 'do_nothing') return r.passed ? 'not solved by doing nothing ✓' : 'SOLVED by doing nothing: trivial task';
  if (tool === 'expert') return r.passed ? 'the expert solved it' : 'the expert failed';
  return 'done';
}
const pending = {};
function onEvent(ev){
  if (ev.type === 'hello'){
    fill('scene', ev.scenes, ev.scene); fill('model', ev.models, ev.model);
    if (ev.new){ document.getElementById('turns').innerHTML = '<div class="t2" style="padding:4px">New chat. Each prompt and check appears here.</div>'; }
    if (ev.turns){ renderTurns(ev.turns, null); if (!col.children.length) replayTurns(ev.turns); }
    if (ev.running){ add(`<div class="err">A request is still running: "${esc(ev.running.text)}" (started ${ev.running.started}). Its steps continue below; press Stop to cancel it.</div>`, 'agent'); setBusy(true, true); }
    if (ev.policies){ fill('policy', ev.policies, document.getElementById('policy').value || ev.policies[0]); }
    if (ev.policy_running){ policyRunning(true); add(`<div class="err">A ${ev.policy_running.policy} run on turn ${ev.policy_running.turn} is going (started ${ev.policy_running.started}); its result appears here and in the sidebar.</div>`, 'agent'); }
    if (ev.trace_dir) document.getElementById('tracedir').textContent = 'traces: ' + ev.trace_dir;
    document.getElementById('base').textContent = 'base (locked): ' + Object.entries(ev.base).map(([n,r]) => `${n} ${r.kind}`).join(' · ');
    return;
  }
  if (ev.type === 'model_start'){ pending.messages = ev.messages; pending.model = step(`${ev.purpose === 'answer' ? 'Thinking' : 'Thinking about the task again'}… (${ev.model}${ev.attempt?', retry '+ev.attempt:''})`, null, undefined, 'run'); return; }
  if (ev.type === 'model_end'){ if (pending.model) pending.model.remove();
    let ans; try { ans = JSON.parse(ev.answer.replace(/^```(json)?|```$/gm,'')); } catch(e){ ans = ev.answer; }
    step(`Model answer (${ev.purpose}${ev.attempt?', retry '+ev.attempt:''})`, 'click: the answer, and exactly what the model was sent', {answer: ans, sent_to_model: pending.messages}, 'ok', ev.seconds); return; }
  if (ev.type === 'validate'){
    if (ev.ok){ const s = ev.summary; step('Validate answer', `scene: ${s.n_add} object(s) · task: ${s.task?'yes':'none'}${s.refusals.length?' · refused: '+s.refusals.map(r=>r.part).join(', '):''}`, s, 'ok'); }
    else step('Validate answer', '✗ ' + ev.errors.join(' | ') + ' → sent back to the model', ev.errors, 'bad');
    return; }
  if (ev.type === 'tool_start'){ pending[ev.tool] = step(brief(ev.tool, ev.args) + ' …', null, undefined, 'run'); return; }
  if (ev.type === 'tool_end'){ if (pending[ev.tool]) pending[ev.tool].remove();
    const d = step(brief(ev.tool, ev.args || {}), resultLine(ev.tool, ev.result || {}, ev.ok), {args: ev.args, result: ev.result}, ev.ok ? 'ok' : 'bad');
    if (ev.tool === 'expert' && !ev.video){ const n = document.createElement('div'); n.className = 'sub'; n.textContent = 'no video: the expert made no moves'; current.steps.appendChild(n); }
    if (ev.video){ const v = document.createElement('video'); v.src = ev.video; v.controls = true; current.steps.appendChild(v); }
    return; }
  if (ev.type === 'second_call'){ step('Scene came out differently', ev.why + ' → asking the model about the task once more', undefined, 'run'); return; }
  if (ev.type === 'task'){ step('Task config', `"${ev.task.instruction}"${ev.missing.length?' · ✗ missing '+ev.missing.join(', '):''}`, ev.task, ev.missing.length?'bad':'ok'); return; }
  if (ev.type === 'done'){ return; }
  if (ev.type === 'reply'){ if (!current) current = agentBlock(); current.text.textContent = ev.text; scroll(); return; }
  if (ev.type === 'render'){ if (!current) current = agentBlock();
    const box = document.createElement('div'); box.className = 'imgs';
    box.innerHTML = Object.entries(ev.images).map(([k,v]) => `<figure><img src="${v}"><figcaption>${k}</figcaption></figure>`).join('');
    current.el.appendChild(box); scroll(); return; }
  if (ev.type === 'error'){ if (ev.traceback){ step('Error: ' + ev.text, 'click for the full traceback', ev.traceback, 'bad'); return; }
    if (!current) current = agentBlock(); const e = document.createElement('div'); e.className = 'err'; e.textContent = ev.text; current.el.appendChild(e); scroll(); return; }
  if (ev.type === 'turns'){ renderTurns(ev.turns, ev.current); return; }
  if (ev.type === 'policy_start'){ policyRunning(true); const a = agentBlock();
    const d = document.createElement('details'); d.className = 'step'; d.id = 'prun';
    d.innerHTML = `<summary><span class="dot run">⏺</span><span>run_policy(${esc(ev.policy)}, turn ${ev.turn}, 30 s) … started ${ev.started}</span></summary><div class="sub">"${esc(ev.task)}" · output ${esc(ev.out)} · you can keep chatting meanwhile</div>`;
    a.steps.appendChild(d); scroll(); return; }
  if (ev.type === 'policy_end'){ policyRunning(false); const old = document.getElementById('prun'); if (old) old.querySelector('.dot').className = 'dot ' + (ev.rc===0?'ok':'bad'), old.removeAttribute('id');
    const a = agentBlock(); const r = ev.result || {}, st = r.stages || {};
    const line = ev.rc !== 0 ? `✗ the run failed (rc ${ev.rc}); click for the log` :
      `${r.success ? 'SUCCESS ✓' : 'not solved ✗'} · stages on ${esc(r.stage_target || '')}: ` + ['reached','closed_at_target','lifted','placed'].map(k => `${k.replace('_at_target','')} ${st[k]?'✓':'✗'}`).join(', ') + ` · ${r.steps} steps · ${Math.round(r.wall_s||0)} s${r.gpu_used_max_gib?' · GPU '+r.gpu_used_max_gib.toFixed(1)+' GiB':''}`;
    const d = document.createElement('details'); d.className = 'step';
    d.innerHTML = `<summary><span class="dot ${ev.rc===0&&r.success?'ok':'bad'}">⏺</span><span>Policy ${esc(ev.run.policy)} on turn ${ev.turn}: result</span><span class="secs">${ev.run.wall_s} s</span></summary><div class="sub">${line}</div><pre class="json">${hl(ev.rc===0 ? r : ev.log_tail)}</pre>`;
    a.steps.appendChild(d);
    if (ev.run.video){ const v = document.createElement('video'); v.src = ev.run.video; v.controls = true; a.steps.appendChild(v); }
    a.text.textContent = 'Video: what the policy saw (exterior composite | wrist). UNVERIFIED.'; scroll(); return; }
  if (ev.type === 'policy_refused'){ const a = agentBlock(); a.text.innerHTML = `<span class="err">Run policy: ${esc(ev.text)}</span>`; scroll(); return; }
  if (ev.type === 'idle'){ setBusy(false); current = null; return; }
  if (ev.type === 'idle_if_not_busy'){ if (!running) setBusy(false); return; }
}
function renderTurns(turns, cur){
  const box = document.getElementById('turns');
  if (!turns.length) return;
  box.innerHTML = turns.slice().reverse().map(t => `<div class="turn ${t.turn===cur?'cur':''}" data-turn="${t.turn}">
    <div class="t1"><span class="n">#${t.turn} ${t.time}</span>${t.status?`<span class="badge ${t.status}">${t.status}</span>`:''}</div>
    <div class="p">${esc(t.kind === 'check' ? 'check: ' + (t.task||'') : t.text)}</div>
    <div class="t2">${t.scene} · ${esc(t.model.split('/').pop())}${t.added.length?' · '+t.added.length+' added':''}${t.task&&t.kind!=='check'?' · task':''}
      · <a href="/trace/${t.turn}" target="_blank" onclick="event.stopPropagation()">trace</a>${t.video?` · <a href="${t.video}" target="_blank" onclick="event.stopPropagation()">video</a>`:''}</div>
    ${(t.runs||[]).map(r => `<div class="run">▶ ${esc(r.policy)} ${r.started||''}: ${r.rc!==0?'<span class="bad">error</span>':(r.success?'<span class="okk">success</span>':'<span class="bad">not solved</span>')}${r.video?` · <a href="${r.video}" target="_blank" onclick="event.stopPropagation()">video</a>`:''}</div>`).join('')}</div>`).join('');
  box.querySelectorAll('.turn').forEach(el => el.onclick = () => { if (busy) return; current = null;
    add(`<div class="bubble">/open turn ${el.dataset.turn}</div>`, 'user'); send({type:'open_turn', turn: Number(el.dataset.turn)}); });
}
function fill(id, opts, sel){ const s = document.getElementById(id); s.innerHTML = opts.map(o => `<option ${o===sel?'selected':''}>${o}</option>`).join(''); }
function send(obj){ if (busy) return; setBusy(true); ws.send(JSON.stringify(obj)); }
document.addEventListener('DOMContentLoaded', () => { document.getElementById('b-stop').disabled = true; });
function connect(){
  ws = new WebSocket(`ws://${location.host}/ws`);
  ws.onmessage = m => onEvent(JSON.parse(m.data));
  ws.onclose = () => { add('<div class="err">disconnected from the server; reload the page after restarting it</div>', 'agent'); setBusy(true); };
}
function submit(){ const t = inp.value.trim(); if (!t || busy) return; add(`<div class="bubble">${esc(t)}</div>`, 'user'); current = null; inp.value = ''; send({type:'prompt', text:t}); }
document.getElementById('send').onclick = submit;
inp.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); submit(); } });
inp.addEventListener('input', () => { inp.style.height = 'auto'; inp.style.height = inp.scrollHeight + 'px'; });
document.getElementById('b-stop').onclick = () => ws.send(JSON.stringify({type:'stop'}));
document.getElementById('b-new').onclick = () => { col.innerHTML = ''; current = null; send({type:'new'}); };
for (const k of ['check','render','composite','save','undo','reset']) document.getElementById('b-'+k).onclick = () => { current = null; add(`<div class="bubble">/${k}</div>`, 'user'); send({type:k}); };
document.getElementById('scene').onchange = e => { current = null; add(`<div class="bubble">/scene ${e.target.value}</div>`, 'user'); send({type:'scene', scene:e.target.value}); };
document.getElementById('b-run').onclick = () => { const p = document.getElementById('policy').value; current = null;
  add(`<div class="bubble">/run ${esc(p)}</div>`, 'user'); ws.send(JSON.stringify({type:'run_policy', policy:p})); };
document.getElementById('b-stoprun').onclick = () => ws.send(JSON.stringify({type:'stop_policy'}));
document.getElementById('model').onchange = e => send({type:'model', model:e.target.value});
connect();
</script>
</body>
</html>
